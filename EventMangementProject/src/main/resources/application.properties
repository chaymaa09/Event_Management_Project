spring.application.name=EventManagementProject
server.port=8081

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/event-management?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# JPA Configuration
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0


# Logging
logging.level.org.flywaydb=INFO
logging.level.com.example.eventmanagementproject=DEBUG
logging.level.org.springframework.security=DEBUG

# keycloak
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/event-management-realm

# Filesystem directory where user avatars are stored.
# Served publicly by WebConfig at /assets/userUploads/**
app.user-avatar-dir=assets/userUploads
