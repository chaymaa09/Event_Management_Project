<div *ngIf="isOpen" class="fixed inset-0 z-50 flex items-start justify-center pt-20 bg-white/80 backdrop-blur-sm" (click)="close()">
  <div class="w-full max-w-2xl bg-white shadow-2xl rounded-2xl border border-gray-100 overflow-hidden flex flex-col max-h-[80vh]" (click)="$event.stopPropagation()">
    
    <div class="p-4 border-b flex items-center gap-3">
      <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      <input 
        #searchInput
        (input)="onTyping(searchInput.value)"
        class="flex-1 outline-none text-xl placeholder-gray-300 font-light" 
        placeholder="Search for events..." 
        focus="true">
      <button (click)="close()" class="text-gray-400 hover:text-gray-600 p-1">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>

    <div class="flex-1 overflow-y-auto p-4 custom-scrollbar">
      
      <div *ngIf="filteredResults.length === 0" class="py-20 text-center">
        <div class="flex justify-center mb-4">
           <div class="w-24 h-24 bg-gray-50 rounded-full flex items-center justify-center border border-gray-100">
             <svg class="w-12 h-12 text-gray-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
           </div>
        </div>
        <h3 class="text-gray-900 font-medium text-lg">No Results Found</h3>
        <p class="text-gray-400 text-sm mt-1">Please try searching for something else.</p>
      </div>

      <div class="space-y-4">
        <div *ngFor="let event of filteredResults" class="flex gap-4 p-2 hover:bg-gray-50 rounded-xl transition-colors cursor-pointer group">
          <img [src]="event.posterUrl" class="w-20 h-20 rounded-lg object-cover bg-gray-100 shadow-sm">
          
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between mb-0.5">
            <span class="text-gray-400 text-xs font-medium">{{ event.startDate | date:'EEE, MMM d, h:mm a' }}</span>
            
            <span *ngIf="event.isVirtual" 
                    class="flex items-center gap-1.5 px-2 py-0.5 bg-emerald-50 text-emerald-600 border border-emerald-100 rounded-full text-[10px] font-bold tracking-widest uppercase">
                
                <span class="relative flex h-1.5 w-1.5">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-1.5 w-1.5 bg-emerald-500"></span>
                </span>
                
                ONLINE
            </span>
            </div>
                        
            <h4 class="font-bold text-gray-900 truncate group-hover:text-blue-600 transition-colors">{{ event.title }}</h4>
            
            <div class="flex items-center gap-2 mt-1">
              <img [src]="event.creator?.avatarUrl" class="w-4 h-4 rounded-full border border-gray-100">
              <span class="text-gray-500 text-xs">By {{ event.creator?.name }}</span>
            </div>

            <p class="text-gray-400 text-xs mt-1 flex items-center gap-1">
              <ng-container *ngIf="!event.isVirtual">
                <span class="text-gray-400">{{ event.location?.name }}</span>
              </ng-container>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
