 <!-- Desktop Navbar -->
  <nav *ngIf="!isAuthPage()"
     class="hidden md:flex fixed top-4 z-50 md:left-1/2 md:-translate-x-1/2 w-full md:w-[90%] rounded-full items-center justify-between gap-6 md:gap-28 px-4 md:px-10 py-2 bg-white/90 backdrop-blur-md shadow-sm transition-all duration-300">
    <a routerLink="/" class="hover:scale-105 transition-transform flex-shrink-0 flex items-center gap-2 font-outfit font-bold text-lg text-slate-900 group">
      <div class="w-9 h-9 bg-gradient-to-br from-purple-500 to-purple-600 rounded-xl flex items-center justify-center group-hover:rotate-12 transition-transform duration-300">
        <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 2v4"></path>
          <path d="M16 2v4"></path>
          <path d="M21 17V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11Z"></path>
          <path d="M3 10h18"></path>
          <path d="M15 22v-4a2 2 0 0 1 2-2h4"></path>
        </svg>
      </div>
      GATHER
    </a>
    
    <!-- Navigation Links & Buttons - Right Side -->
    <div class="ml-auto flex gap-6 items-center">
      <!-- Show different buttons based on page -->
      <ng-container *ngIf="!isLoggedIn()">
          <button (click)="login()" class="text-gray-700 font-semibold px-5 py-2 rounded-full text-sm">
            Sign In
          </button>
          <button (click)="register()" class="bg-black text-white px-5 py-2 rounded-full font-semibold text-sm">
            Sign Up
          </button>
      </ng-container>

      <ng-container *ngIf="isLoggedIn()">

        <a routerLink="/explore"
          [ngClass]="{'font-semibold text-gray-900': router.url.includes('/events')}">
          Explore
        </a>

        <a routerLink="/communities"
          [ngClass]="{'font-semibold text-gray-900': router.url.includes('/communities')}">
          Communities
        </a>

        <div class="h-6 w-px bg-gray-300"></div>
        
        <a routerLink="/create-event">
          <button class="bg-black text-white px-5 py-2 rounded-full text-sm">
            Create
          </button>
        </a>

        <!-- Profile avatar + dropdown -->
        <div class="relative">
          <button
            type="button"
            (click)="toggleProfileMenu()"
            class="w-9 h-9 rounded-full overflow-hidden ring-2 ring-purple-100 focus:outline-none"
            aria-haspopup="menu"
            [attr.aria-expanded]="isProfileMenuOpen"
          >
            <img
              *ngIf="getAvatarUrl(); else avatarFallback"
              [src]="getAvatarUrl()"
              class="w-full h-full object-cover"
              alt="User avatar"
            />
            <ng-template #avatarFallback>
              <div class="w-full h-full bg-slate-900 text-white flex items-center justify-center font-semibold">
                {{ getUserInitials() }}
              </div>
            </ng-template>
          </button>

          <div
            *ngIf="isProfileMenuOpen"
            class="absolute right-0 mt-1 w-64 rounded-md bg-white text-slate-900 shadow-2xl border border-gray-200 overflow-hidden"
            role="menu"
          >
            <button
              type="button"
              (click)="viewProfile()"
              class="w-full text-left px-3 py-2.5 flex items-center gap-3 hover:bg-slate-50 transition-colors"
              role="menuitem"
              aria-label="View profile"
            >
              <div class="w-9 h-9 rounded-full overflow-hidden bg-slate-100 flex-shrink-0">
                <img
                  *ngIf="getAvatarUrl(); else avatarFallback2"
                  [src]="getAvatarUrl()"
                  class="w-full h-full object-cover"
                  alt="User avatar"
                />
                <ng-template #avatarFallback2>
                  <div class="w-full h-full text-slate-900 flex items-center justify-center font-semibold">
                    {{ getUserInitials() }}
                  </div>
                </ng-template>
              </div>

              <div class="min-w-0">
                <div class="font-semibold truncate">{{ getDisplayName() }}</div>
                <div class="text-sm text-slate-500 truncate">{{ getEmail() }}</div>
              </div>
            </button>

            <div class="h-px bg-gray-200"></div>

            <button
              type="button"
              (click)="viewProfile()"
              class="w-full text-left px-3 py-2.5 hover:bg-slate-50 transition-colors text-sm"
              role="menuitem"
            >
              View Profile
            </button>

            <button
              type="button"
              (click)="openSettings()"
              class="w-full text-left px-3 py-2.5 hover:bg-slate-50 transition-colors text-sm"
              role="menuitem"
            >
              Settings
            </button>

            <div class="h-px bg-gray-200"></div>

            <button
              type="button"
              (click)="logout()"
              class="w-full text-left px-3 py-2.5 hover:bg-slate-50 transition-colors text-sm"
              role="menuitem"
            >
              logout
            </button>
          </div>
        </div>

      </ng-container>
    </div>
  </nav>

  <!-- Mobile Navbar -->
<nav 
     class="md:hidden fixed top-0 left-0 right-0 z-[9999] isolate p-3 pointer-events-auto">

    <div class="flex justify-between items-center bg-white p-3 rounded-3xl shadow-lg">
      <a routerLink="/" class="flex items-center gap-2 font-outfit font-bold text-lg text-slate-900">
        <div class="w-8 h-8 bg-gradient-to-br from-gather-purple to-gather-pink rounded-lg flex items-center justify-center">
          <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 2v4"></path>
            <path d="M16 2v4"></path>
            <path d="M21 17V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11Z"></path>
            <path d="M3 10h18"></path>
            <path d="M15 22v-4a2 2 0 0 1 2-2h4"></path>
          </svg>
        </div>
        GATHER
      </a>

      <button *ngIf="isLoggedIn()" (click)="toggleMobileMenu()" class="text-slate-800 p-2" aria-controls="mobile-menu" [attr.aria-expanded]="isMobileMenuOpen">
        <svg *ngIf="!isMobileMenuOpen" class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="4" y1="6" x2="20" y2="6"></line>
          <line x1="4" y1="12" x2="20" y2="12"></line>
          <line x1="4" y1="18" x2="20" y2="18"></line>
        </svg>
        <svg *ngIf="isMobileMenuOpen" class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- Backdrop (blocks page overlays & allows click-outside close) -->
    <div *ngIf="isMobileMenuOpen"
        class="fixed inset-0 z-[9998]"
        (click)="closeMobileMenu()">
    </div>


    <!-- Mobile Menu Dropdown -->
   <div *ngIf="isMobileMenuOpen" 
     id="mobile-menu"
     class="fixed top-24 right-4 w-48 rounded-2xl p-3 shadow-2xl flex flex-col gap-1.5 bg-white z-[9999] text-sm border border-gray-100 animate-slideIn pointer-events-auto">

     
  
    <ng-container *ngIf="isLoggedIn()">
      <!-- Regular pages mobile menu -->
      <a routerLink="/home" 
        (click)="closeMobileMenu()" 
        class="text-base font-medium py-2.5 px-4 rounded-xl text-center transition-all duration-200 hover:scale-[1.02] active:scale-[0.98]"
        [ngClass]="{'bg-slate-900 text-white shadow-md': router.url === '/home', 'text-slate-700 hover:bg-slate-50': router.url !== '/home'}">
        <span class="flex items-center justify-center gap-2">
          <svg *ngIf="router.url === '/home'" class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
            <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/>
          </svg>
          Home
        </span>
      </a>

      <a routerLink="/explore" 
        (click)="closeMobileMenu()" 
        class="text-base font-medium py-2.5 px-4 rounded-xl text-center transition-all duration-200 hover:scale-[1.02] active:scale-[0.98]"
        [ngClass]="{'bg-slate-900 text-white shadow-md': router.url.includes('/explore'), 'text-slate-700 hover:bg-slate-50': !router.url.includes('/explore')}">
        <span class="flex items-center justify-center gap-2">
          <svg *ngIf="router.url.includes('/explore')" class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/>
          </svg>
          Explore
        </span>
      </a>

      <a routerLink="/communities" 
        (click)="closeMobileMenu()" 
        class="text-base font-medium py-2.5 px-4 rounded-xl text-center transition-all duration-200 hover:scale-[1.02] active:scale-[0.98]"
        [ngClass]="{'bg-slate-900 text-white shadow-md': router.url.includes('/communities'), 'text-slate-700 hover:bg-slate-50': !router.url.includes('/communities')}">
        <span class="flex items-center justify-center gap-2">
          <svg *ngIf="router.url.includes('/communities')" class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
            <path d="M13 6a3 3 0 11-6 0 3 3 0 016 0zM18 8a2 2 0 11-4 0 2 2 0 014 0zM14 15a4 4 0 00-8 0v3h8v-3zM6 8a2 2 0 11-4 0 2 2 0 014 0zM16 18v-3a5.972 5.972 0 00-.75-2.906A3.005 3.005 0 0119 15v3h-3zM4.75 12.094A5.973 5.973 0 004 15v3H1v-3a3 3 0 013.75-2.906z"/>
          </svg>
          Communities
        </span>
      </a>

      <!-- Divider -->
      <div class="h-px bg-gray-200 my-1"></div>

      <a routerLink="/create-event" (click)="closeMobileMenu()">
        <button class="w-full text-slate-700 font-medium py-2.5 px-4 rounded-xl text-center text-sm hover:bg-slate-50 hover:scale-[1.02] active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
          </svg>
          Create Event
        </button>
      </a>

      <!-- Logout button for mobile -->
      <button class="w-full text-red-600 font-medium py-2.5 px-4 rounded-xl text-center text-sm hover:bg-red-50 hover:scale-[1.02] active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2" (click)="authService.logout(); closeMobileMenu()">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
        </svg>
        Logout
      </button>
    </ng-container>
  </div>


  </nav>
